name: release

on:
  push:
    tags: ["v*"]
  # A dry run: builds and assembles everything and uploads the assets as workflow
  # artifacts, but publishes no release (the publish step only runs for a tag).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The release notes are the changelog section for this version, and a release
      # without one is not published: this fails the job, naming the version. A tag
      # supplies the version; a manual dry run uses the one in pyproject.toml, so a
      # missing entry is caught before anyone tags.
      - name: Release notes from the changelog
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          fi
          echo "release notes for ${version}"
          .github/scripts/release-notes.sh "${version}" | tee release-notes.md

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The ONLY place Node runs: the release contains the compiled bundle, never the
      # frontend source, so the target host needs no Node and no compiler.
      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build
          test -f src/xonotic_webui/static/index.html

      # A pure-python wheel that carries the prebuilt static/ bundle (force-include in
      # pyproject.toml). The installer installs it by path and resolves dependencies as
      # prebuilt wheels.
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          ls dist/xonotic_webui-*-py3-none-any.whl

      # Asserts the wheel carries the interface and that no frontend source ships.
      - name: Assemble release assets
        run: scripts/assemble-release.sh release

      - name: Upload assets as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            release/*.tar.gz
            release/install.sh
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            release/*.tar.gz
            release/install.sh
          fail_on_unmatched_files: true
