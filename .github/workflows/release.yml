name: release

on:
  push:
    tags: ["v*"]
  # A dry run: builds and assembles everything and uploads the assets as workflow
  # artifacts, but publishes no release (the publish step only runs for a tag).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The ONLY place Node runs: the release contains the compiled bundle, never the
      # frontend source, so the target host needs no Node and no compiler.
      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build
          test -f src/xonotic_webui/static/index.html

      # A pure-python wheel that carries the prebuilt static/ bundle (force-include in
      # pyproject.toml). The installer installs it by path and resolves dependencies as
      # prebuilt wheels.
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          ls dist/xonotic_webui-*-py3-none-any.whl

      # Asserts the wheel carries the interface and that no frontend source ships.
      - name: Assemble release assets
        run: scripts/assemble-release.sh release

      - name: Upload assets as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release/xonotic-webui.tar.gz
            release/install.sh
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/xonotic-webui.tar.gz
            release/install.sh
          fail_on_unmatched_files: true
