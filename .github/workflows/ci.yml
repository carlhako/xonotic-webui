name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check src tests scripts deploy/xonotic-webui-upgrade
          ruff format --check src tests scripts deploy/xonotic-webui-upgrade
      - name: Test
        run: pytest -q

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck deploy/install.sh scripts/assemble-release.sh .github/scripts/release-notes.sh
      # The only message tolerated is that the installed binaries are absent on the CI
      # runner; any other complaint about a unit fails the job.
      - name: systemd units
        run: |
          out="$(systemd-analyze verify deploy/*.service deploy/*.path 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -v 'is not executable' | grep -q .; then exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Lint
        run: npm --prefix web run lint
      - name: Test
        run: npm --prefix web test
      - name: Build
        run: npm --prefix web run build
      - name: Generated API types are up to date
        run: |
          npm --prefix web run gen:api
          git diff --exit-code web/src/api/schema.d.ts
