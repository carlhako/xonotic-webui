name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Test
        run: pytest -q

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck deploy/install.sh scripts/assemble-release.sh
      - name: systemd unit
        run: systemd-analyze verify deploy/xonotic-webui.service 2>&1 | grep -v 'is not executable' || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Lint
        run: npm --prefix web run lint
      - name: Test
        run: npm --prefix web test
      - name: Build
        run: npm --prefix web run build
      - name: Generated API types are up to date
        run: |
          npm --prefix web run gen:api
          git diff --exit-code web/src/api/schema.d.ts
