[project]
name = "xonotic-webui"
version = "0.1.0"
description = "Supervised web control panel for a Xonotic dedicated server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.4",
    "build>=1.0",
]

[project.scripts]
xonotic-webui = "xonotic_webui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xonotic_webui"]

[tool.hatch.build.targets.wheel.force-include]
"src/xonotic_webui/static" = "xonotic_webui/static"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test helpers legitimately take a `timeout` argument.
"tests/**" = ["ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
filterwarnings = [
    "error",
    # Third-party ecosystem churn we don't control:
    "ignore::DeprecationWarning:anyio.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "default::DeprecationWarning:starlette.*",
]
